name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        django: ['>=5.2,<5.3', '>=6.0,<6.1']
        exclude:
          - python: '3.10'
            django: '>=6.0,<6.1'
          - python: '3.11'
            django: '>=6.0,<6.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . 'Django${{ matrix.django }}' build
      - run: python -Wd -m django test --settings=tests.settings --noinput
      - run: python example/manage.py check
      - run: python -m build
